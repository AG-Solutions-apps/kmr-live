plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}

import java.util.Properties

// 🔐 Load keystore.properties file
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
} else {
    println("⚠️ keystore.properties file not found at: ${keystorePropertiesFile.absolutePath}")
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode") ?: "11"
def flutterVersionName = localProperties.getProperty("flutter.versionName") ?: "1.11"

android {
    namespace "com.kmr.agsolutions"
    compileSdk 35
    ndkVersion "25.1.8937393"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId "com.kmr.agsolutions"
        minSdkVersion 23
        targetSdkVersion 35
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    signingConfigs {
        release {
            def keyAliasProp = keystoreProperties["keyAlias"]
            def keyPasswordProp = keystoreProperties["keyPassword"]
            def storeFilePath = keystoreProperties["storeFile"]
            def storePasswordProp = keystoreProperties["storePassword"]

            if (keyAliasProp && keyPasswordProp && storeFilePath && storePasswordProp) {
                keyAlias = keyAliasProp
                keyPassword = keyPasswordProp
                storeFile = file(storeFilePath)
                storePassword = storePasswordProp
            } else {
                println("⚠️ Skipping signing config: Missing keystore properties.")
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
        }
    }
}

flutter {
    source "../.."
}

dependencies {
    implementation "com.google.firebase:firebase-messaging:23.4.1"
    implementation "com.google.firebase:firebase-auth"
}